# V6 S-04/O-02：健康端点 + Prometheus 指标（网关 /health/aggregate 聚合读取）
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c

server:
  port: 8201
  tomcat:
    max-http-form-post-size: 25MB

spring:
  application:
    name: mall-system
  # 跨服务调用必须有超时：下游慢一个请求，不加超时就会拖满调用方线程池（雪崩起点）
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: ${FEIGN_CONNECT_TIMEOUT:2000}
            readTimeout: ${FEIGN_READ_TIMEOUT:5000}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/yueji_mall?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.mall.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 文件能力包：上传目录 / 大小上限 / 扩展名白名单；均含内置默认，零配置开箱即跑
# upload-dir 决定 /uploads/** 静态直链与 /thumb 缩略图的源目录：
#   默认 ./uploads 是**相对进程工作目录**的，因此必须在 be/mall-cloud 目录下启动，
#   否则目录漂移、历史图片全部 404（表现为 <img> 破图但接口 200，极易误判）。
#   换目录用 FILE_UPLOAD_DIR 覆盖即可（同一份文件给多实例共享时有用）。
file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}
  max-size-mb: ${FILE_MAX_SIZE_MB:10}
  allowed-exts: jpg,jpeg,png,gif,webp,bmp,pdf,doc,docx,xls,xlsx,ppt,pptx,txt,csv,zip,rar,7z,mp3,mp4

app:
  ip-region:
    enabled: true
    offline: true
    api: http://ip-api.com/json/{ip}?lang=zh-CN
    timeout-ms: 3000

logging:
  # V6 O-03：统一日志格式（时间 / 级别 / 线程 / traceId / logger / 消息）
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-}] %logger{40} - %msg%n"
  level:
    com.mall: info

auth:
  session-hours: 24
  captcha:
    # 自动验收需要答案（脚本无人看图）：只在联调/CI 打开，生产必须为 false
    expose-answer: ${AUTH_CAPTCHA_EXPOSE_ANSWER:false}
