# V6 S-04/O-02：健康端点 + Prometheus 指标（网关 /health/aggregate 聚合读取）
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c

server:
  port: 8204
  tomcat:
    max-http-form-post-size: 25MB

spring:
  application:
    name: mall-order
  # 跨服务调用必须有超时：下游慢一个请求，不加超时就会拖满调用方线程池（雪崩起点）
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: ${FEIGN_CONNECT_TIMEOUT:2000}
            readTimeout: ${FEIGN_READ_TIMEOUT:5000}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/yueji_mall?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.mall.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  ip-region:
    enabled: true
    offline: true
    api: http://ip-api.com/json/{ip}?lang=zh-CN
    timeout-ms: 3000

# 跨域 Feign 调用目标（静态地址，无注册中心；缺省见 mall-common 的 @FeignClient 声明）
feign:
  clients:
    mall-goods: ${FEIGN_MALL_GOODS_URL:http://localhost:8202}
    mall-member: ${FEIGN_MALL_MEMBER_URL:http://localhost:8203}
    mall-marketing: ${FEIGN_MALL_MARKETING_URL:http://localhost:8205}
    mall-refund: ${FEIGN_MALL_REFUND_URL:http://localhost:8206}

logging:
  # V6 O-03：统一日志格式（时间 / 级别 / 线程 / traceId / logger / 消息）
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-}] %logger{40} - %msg%n"
  level:
    com.mall: info

auth:
  session-hours: 24

# 熔断参数：10 次窗口、失败率 50% 打开、打开 10s 后半开放 5 个探测
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 5
        registerHealthIndicator: true
  timelimiter:
    configs:
      default:
        timeoutDuration: 8s
        cancelRunningFuture: true
