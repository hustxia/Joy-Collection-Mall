# V16 在线 AI 客服（8210）
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c

server:
  port: 8210

spring:
  application:
    name: mall-ai
  mvc:
    async:
      # SSE 长连接：单次回答超时 15s，留足余量
      request-timeout: 30000
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/yueji_mall?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.mall.ai.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  ai:
    # 演示默认 mock：不依赖外部网络也能跑通全链路；生产切 openai / ollama
    provider: ${LLM_PROVIDER:mock}
    # openai 兼容协议（DeepSeek / 通义 / Kimi 等改 base-url 与 model 即可）
    openai:
      base-url: ${LLM_BASE_URL:https://api.deepseek.com}
      path: ${LLM_PATH:/chat/completions}
      api-key: ${LLM_API_KEY:}
      model: ${LLM_MODEL:deepseek-chat}
      temperature: 0.3
      max-tokens: 600
      timeout-ms: 12000
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
      model: ${OLLAMA_MODEL:qwen2.5-coder:7b}
      timeout-ms: 20000
    # 上下文轮数与限流（成本控制）
    history-rounds: 6
    max-message-chars: 500
    rate-limit-per-minute: 12
    rate-limit-per-day: 200
    # 转人工触发：连续兜底次数
    transfer-after-fallback: 2

feign:
  clients:
    mall-order: ${FEIGN_MALL_ORDER_URL:http://localhost:8204}
    mall-refund: ${FEIGN_MALL_REFUND_URL:http://localhost:8206}
    mall-support: ${FEIGN_MALL_SUPPORT_URL:http://localhost:8208}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-}] %logger{40} - %msg%n"
  level:
    com.mall: info

auth:
  session-hours: 24
