# V6 K-01：微服务公共配置（打包在 mall-config，各服务 application.yml 用
#   spring.config.import: classpath:common.yml 引入）
# 原则：只放「所有服务完全一致」的配置；端口、服务名、路由、业务开关留在各自 yml。

# V6 S-04/O-02：健康端点 + Prometheus 指标（网关 /health/aggregate 聚合读取）
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  # V6 O-01：全量采样（本机/演示）；生产按流量下调
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c

server:
  tomcat:
    max-http-form-post-size: 25MB

spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  # 跨服务调用必须有超时：下游慢一个请求，不加超时就会拖满调用方线程池（雪崩起点）
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: ${FEIGN_CONNECT_TIMEOUT:2000}
            readTimeout: ${FEIGN_READ_TIMEOUT:5000}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.mall.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 全局兜底熔断参数：10 次窗口、失败率 50% 打开、打开 10s 后半开放 5 个探测
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 5
        registerHealthIndicator: true
  timelimiter:
    configs:
      default:
        timeoutDuration: 8s
        cancelRunningFuture: true

app:
  ip-region:
    enabled: true
    offline: true
    api: http://ip-api.com/json/{ip}?lang=zh-CN
    timeout-ms: 3000

auth:
  session-hours: 24

# V6 O-03：统一日志格式（时间 / 级别 / 线程 / traceId / logger / 消息）
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-}] %logger{40} - %msg%n"
  level:
    com.mall: info
