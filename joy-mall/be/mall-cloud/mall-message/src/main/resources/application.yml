# V14 消息服务（8209）
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c

server:
  port: 8209

spring:
  application:
    name: mall-message
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/yueji_mall?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.mall.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  message:
    # 主通道失败后的重试次数（不含首次尝试）：需求 REQ-P1-09「失败重试」+ 2 次上限
    max-retries: 2
    sms:
      # 未接短信服务商时置 false：SmsChannel.available()=false，所有发送直接降级站内信
      enabled: ${SMS_ENABLED:false}
      # 模拟发送失败：联调降级链路用（true 时每次发送都返回失败）
      simulate-fail: ${SMS_SIMULATE_FAIL:false}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-}] %logger{40} - %msg%n"
  level:
    com.mall: info

auth:
  session-hours: 24
