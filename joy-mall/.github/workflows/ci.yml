# V6 C-01~C-03：构建 + 单测 + compose 冒烟
#
# 为什么不是 Gitee Go：官方 build@maven 插件最高只支持 JDK 17，本仓库是 Java 21。
# 触发方式：推送到 GitHub 镜像仓（或在 GitHub 上新建同名仓库并 push）。
# 门禁：master 分支保护里勾选 "Require status checks to pass before merging"，
#       必需检查选 "构建与单测（mvn verify）" 与 "compose 冒烟（51 断言）"。
name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - 'docs/**'
      - 'audit/**'
      - '**.md'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # C-01 构建与单测：mvn verify 跑 T-01 交易/售后、T-02 上下文、T-03 Feign 契约
  build-test:
    name: 构建与单测（mvn verify）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # 测试库由 mall-test-support 的 application-test.yml 自动建（createDatabaseIfNotExist=true）
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21 与 Maven 缓存
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: mvn verify
        env:
          TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/yueji_mall_test?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
          TEST_DB_USERNAME: root
          TEST_DB_PASSWORD: root
        run: mvn -B -f be/mall-cloud/pom.xml verify

      - name: 失败时上传 surefire 报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: be/mall-cloud/**/target/surefire-reports/**
          if-no-files-found: ignore

  # C-02 集成冒烟：compose 起整套（mysql + 6 服务 + 网关 + 三端 nginx），跑 51 条 API 断言
  compose-smoke:
    name: compose 冒烟（51 断言）
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # 仅 CI 打开：让冒烟脚本自动取到算术验证码答案（生产必须 false）
      AUTH_CAPTCHA_EXPOSE_ANSWER: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21 与 Maven 缓存
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 打包 7 个可执行 jar
        run: mvn -B -f be/mall-cloud/pom.xml -DskipTests package

      - name: docker compose 起整套环境
        run: docker compose up -d --build

      - name: 轮询 /health/aggregate 直到全 UP
        run: |
          for i in $(seq 1 60); do
            body=$(curl -fsS http://127.0.0.1:8080/health/aggregate || true)
            if echo "$body" | grep -q '"status":"UP"'; then
              echo "健康聚合 UP（第 $i 次探测）"
              echo "$body"
              exit 0
            fi
            sleep 5
          done
          echo "健康聚合在 300s 内未达到 UP"
          curl -sS http://127.0.0.1:8080/health/aggregate || true
          exit 1

      - name: 接口冒烟（51 断言，走三端 nginx 反代 = 前端真实路径）
        run: node mall-cloud-fe-smoke.mjs

      - name: 收集容器日志
        if: always()
        run: docker compose logs --no-color > compose-logs.txt 2>&1 || true

      - name: 失败时上传容器日志（能直接定位到具体服务）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt

      - name: 清理环境
        if: always()
        run: docker compose down -v
