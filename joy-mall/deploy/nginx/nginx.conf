# V6 D-02：三端入口 + 网关反向代理
# 端口与本地 dev 保持一致（9431 后台 / 9432 PC / 9531 H5），冒烟脚本无需改地址。
# 前端 history 路由需要 try_files 兜底 index.html，否则刷新页面 404。

upstream mall-gateway {
    server mall-gateway:8080;
}

# ——— 后台管理（mall-web，Vue CLI，API 前缀 /prod-api，dev 构建为 /dev-api）———
server {
    listen 9431;
    root /usr/share/nginx/html/admin;
    index index.html;
    client_max_body_size 25m;

    # /dev-api/api/mall/xxx 与 /prod-api/api/mall/xxx 都要剥成 /xxx
    location ~ ^/(prod-api|dev-api)(/api/mall)?/(?<rest>.*)$ {
        proxy_pass http://mall-gateway/$rest$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/(prod-api|dev-api)(/api/mall)?$ {
        proxy_pass http://mall-gateway/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 图片 / 缩略图直链（网关按 /uploads、/thumb、/img 前缀转发到系统服务）
    location ^~ /uploads/ { proxy_pass http://mall-gateway; }
    location ^~ /thumb/   { proxy_pass http://mall-gateway; }
    location ^~ /img/     { proxy_pass http://mall-gateway; }

    location / { try_files $uri $uri/ /index.html; }
}

# ——— PC 商城（mall-pc，API 前缀 /shop，不需要剥离）———
server {
    listen 9432;
    root /usr/share/nginx/html/pc;
    index index.html;
    client_max_body_size 25m;

    location ^~ /shop/    { proxy_pass http://mall-gateway; }
    location ^~ /uploads/ { proxy_pass http://mall-gateway; }
    location ^~ /thumb/   { proxy_pass http://mall-gateway; }
    location ^~ /img/     { proxy_pass http://mall-gateway; }

    location / { try_files $uri $uri/ /index.html; }
}

# ——— 移动端 H5（mall-shop，API 前缀 /api，剥成干净路径）———
server {
    listen 9531;
    root /usr/share/nginx/html/h5;
    index index.html;
    client_max_body_size 25m;

    location ~ ^/api/(?<rest>.*)$ {
        proxy_pass http://mall-gateway/$rest$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api { proxy_pass http://mall-gateway/; }
    location ^~ /uploads/ { proxy_pass http://mall-gateway; }
    location ^~ /thumb/   { proxy_pass http://mall-gateway; }
    location ^~ /img/     { proxy_pass http://mall-gateway; }

    location / { try_files $uri $uri/ /index.html; }
}
